app:
  name: "LLM Local Test Lab"
  host: "0.0.0.0"
  port: 7357
  debug: true
  database_url: "sqlite:///data/app.db"

paths:
  uploads_dir: "app/uploads"
  reports_dir: "data/reports"
  exports_dir: "data/exports"
  secrets_file: "secrets/secret.key"

providers:
  ollama:
    enabled: true
    base_url: "http://172.23.144.1:11434/v1"
    timeout_seconds: 300
  openrouter:
    enabled: true
    base_url: "https://openrouter.ai/api/v1"
    timeout_seconds: 300
    app_name: "LLM Local Test Lab"
    site_url: "http://localhost:7357"

