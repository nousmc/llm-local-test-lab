validator:
  enabled: true
  provider: "openrouter"
  model: "deepseek/deepseek-v4-pro"
  fallback_provider: "openrouter"
  fallback_model: "deepseek/deepseek-v4-flash"
  validation_mode: "rubric_json"
  temperature: 0.0
  max_tokens: 4096

execution:
  parallelism: 4
  retry_attempts: 2
  retry_backoff_seconds: 3
  save_raw_responses: true
  save_prompts: true
  stop_on_provider_error: false

metrics:
  enabled:
    - exact_match
    - json_validity
    - schema_compliance
    - field_accuracy
    - semantic_similarity
    - validator_score
    - latency_ms
    - tokens_per_second
    - prompt_tokens
    - completion_tokens
    - total_tokens
    - estimated_cost
    - hallucination_flag
    - refusal_flag

test_types:
  - id: "classification"
    label: "Classificazione"
    expected_schema: "classification_expected"
  - id: "data_extraction"
    label: "Estrazione dati"
    expected_schema: "json_expected"
  - id: "rag_qa"
    label: "RAG / Q&A documentale"
    expected_schema: "rag_expected"
  - id: "summarization"
    label: "Sintesi"
    expected_schema: "summary_expected"
  - id: "code_analysis"
    label: "Analisi codice"
    expected_schema: "code_expected"
  - id: "code_documentation"
    label: "Documentazione codice"
    expected_schema: "code_doc_expected"
  - id: "refactoring"
    label: "Refactoring"
    expected_schema: "refactoring_expected"
  - id: "image_description"
    label: "Descrizione immagine"
    expected_schema: "vision_expected"
  - id: "ocr_extraction"
    label: "OCR / estrazione testo da immagine"
    expected_schema: "ocr_expected"
  - id: "speech_to_text_postprocess"
    label: "Post-processing Speech-to-Text"
    expected_schema: "stt_expected"
  - id: "contextual_insight"
    label: "Brainstorming e Conoscenza Contestuale"
    expected_schema: "insight_expected"

thresholds:
  default_pass_score: 0.80
  json_validity_required: true
  max_latency_ms_warning: 60000
