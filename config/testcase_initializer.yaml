    \ = Query(None, regex=\\\"^(pending|shipped|delivered|cancelled)$\\\"),\n    sort_by:\
    \ str = Query(\\\"created_at\\\", regex=\\\"^(created_at|total|status)$\\\"),\n\
    \    order: str = Query(\\\"desc\\\", regex=\\\"^(asc|desc)$\\\")\n):\n    \\\"\
    \\\"\\\"API per elencare gli ordini con paginazione e filtri\\\"\\\"\\\"\n   \
    \ query = db.query(Order)\n    if status:\n        query = query.filter(Order.status\
    \ == status)\n    total = query.count()\n    if order == \\\"asc\\\":\n      \
    \  query = query.order_by(getattr(Order, sort_by).asc())\n    else:\n        query\
    \ = query.order_by(getattr(Order, sort_by).desc())\n    orders = query.offset((page\
    \ - 1) * limit).limit(limit).all()\n    return {\n        \\\"data\\\": [o.to_dict()\
    \ for o in orders],\n        \\\"page\\\": page,\n        \\\"limit\\\": limit,\n\
    \        \\\"total\\\": total\n    }"
