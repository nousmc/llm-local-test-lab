# Prompt templates for each test type.
# Placeholders: {input_text} {context} {instructions} {allowed_labels}
#   {field_list} {field_placeholders} {format_constraint} {length_constraint}
#   {doc_style} {language} {style} {target} {constraints} {answer_absent_rule}
#   {custom_rules}  ← renders as "Regole:\n- ..." when non-empty (user-editable per TC)
# The answer_format field is injected into MESSAGE_CONTAINER_TEMPLATE via %s.

classification:
  body: |
    Devi classificare il testo nella categoria corretta.

    Classi ammesse (scegline UNA SOLA): {allowed_labels}

    {custom_rules}
    Input da classificare:
    {input_text}
  answer_format: '{ "label": "classe_scelta" }'

data_extraction:
  body: |
    Devi estrarre dati strutturati dal testo.

    Campi da estrarre (con tipo):
    {field_list}

    {custom_rules}
    Input da analizzare:
    {input_text}
  answer_format: '{ {field_placeholders} }'

rag_qa:
  body: |
    Rispondi alla domanda basandoti ESCLUSIVAMENTE sul contesto fornito.

    {answer_absent_rule}

    {custom_rules}
    Domanda:
    {input_text}

    Contesto:
    {context}
  answer_format: '{ "answer_text": "risposta basata sul contesto", "citations_used": ["parte del contesto citata..."], "answer_absent": false }'

summarization:
  body: |
    Devi riassumere il testo fornito.

    {format_constraint}
    {length_constraint}

    {custom_rules}
    Testo da sintetizzare:
    {input_text}
  answer_format: '{ "summary": "testo del riassunto", "key_points": ["punto 1", "punto 2"] }'

code_analysis:
  body: |
    Analizza il codice fornito e identifica problemi, bug o vulnerabilita.

    Linguaggio: {language}

    {ca_instructions}

    {custom_rules}
    Codice da analizzare:
    {input_text}
  answer_format: '{ "findings": [{ "type": "bug|security|best_practice|performance", "severity": "low|medium|high|critical", "location": "linea o funzione", "description": "descrizione del problema", "recommendation": "come risolvere" }], "overall_assessment": "valutazione complessiva" }'

code_documentation:
  body: |
    Scrivi la documentazione per il codice fornito.

    Stile: {doc_style}
    Lingua: {language}

    {custom_rules}
    Codice da documentare:
    {input_text}
  answer_format: '{ "docstring": "documentazione completa", "parameters": [{ "name": "nome", "type": "tipo", "description": "descrizione" }], "returns": { "type": "tipo", "description": "descrizione" }, "raises": [{ "exception": "NomeEccezione", "condition": "quando viene sollevata" }], "examples": ["esempio duso"] }'

refactoring:
  body: |
    Riscrivi il codice applicando refactoring.

    Obiettivo: {target}

    Vincoli:
    {constraints}

    {custom_rules}
    Codice da rifattorizzare:
    {input_text}
  answer_format: '{ "refactored_code": "codice rifattorizzato", "changes_summary": ["cambio 1", "cambio 2"], "preserved_behavior": true }'

image_description:
  body: |
    Descrivi l'immagine in modo neutro e oggettivo.

    Stile: {style}
    {length_constraint}

    {custom_rules}
    {input_text}
  answer_format: '{ "description": "descrizione oggettiva dellimmagine", "objects_detected": ["oggetto 1", "oggetto 2"], "scene_type": "tipo di scena", "dominant_colors": ["colore 1"] }'

ocr_extraction:
  body: |
    Estrai i dati dal documento OCR.

    Campi da estrarre:
    {field_list}

    {custom_rules}
    Documento da analizzare:
    {input_text}
  answer_format: '{ {field_placeholders} }'

speech_to_text_postprocess:
  body: |
    Pulisci e struttura la trascrizione grezza.

    {stt_instructions}

    {custom_rules}
    Trascrizione grezza:
    {input_text}
  answer_format: '{ "clean_transcript": "trascrizione pulita", "action_items": [{ "owner": "nome o null", "task": "task da fare", "deadline": "data o null" }], "entities_mentioned": [{ "name": "nome entita", "type": "person|date|project|other" }] }'

contextual_insight:
  body: |
    Analizza la conversazione multi-turno e produci un'analisi strutturata che dimostri comprensione del contesto, capacita di approfondimento e creativita pertinente al dominio.

    Scenario:
    {input_text}

    Contesto aggiuntivo:
    {context}

    {ci_instructions}

    {custom_rules}
  answer_format: '{ "insights": ["idea concreta 1", "idea concreta 2"], "references_to_context": ["riferimento al turno X"], "follow_up_questions": ["domanda di approfondimento"], "depth": "dominio_scelto" }'
